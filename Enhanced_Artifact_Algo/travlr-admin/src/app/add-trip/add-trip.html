<div class="container mt-4">
  <h1>Add a Trip</h1>

  <div class="alert alert-danger" *ngIf="submitError">{{ submitError }}</div>

  <form [formGroup]="tripForm" (ngSubmit)="onSubmit()" novalidate>
    <div class="mb-3">
      <label class="form-label" for="code">Trip Code</label>
      <input class="form-control" id="code" type="text" formControlName="code">
      <div class="text-danger" *ngIf="f['code'].touched && f['code'].invalid">Trip code is required.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" type="text" formControlName="name">
      <div class="text-danger" *ngIf="f['name'].touched && f['name'].invalid">Name is required.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="length">Length</label>
      <input class="form-control" id="length" type="text" formControlName="length" placeholder="e.g. 3 nights / 4 days">
      <div class="text-danger" *ngIf="f['length'].touched && f['length'].invalid">Length is required.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="start">Start Date</label>
      <input class="form-control" id="start" type="text" formControlName="start" placeholder="YYYY-MM-DD">
      <div class="text-danger" *ngIf="f['start'].touched && f['start'].invalid">Start date is required.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="resort">Resort</label>
      <input class="form-control" id="resort" type="text" formControlName="resort">
      <div class="text-danger" *ngIf="f['resort'].touched && f['resort'].invalid">Resort is required.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="perPerson">Price Per Person</label>
      <input class="form-control" id="perPerson" type="number" min="0" formControlName="perPerson">
      <div class="text-danger" *ngIf="f['perPerson'].touched && f['perPerson'].invalid">
        Enter a valid, non-negative price.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="image">Image Filename</label>
      <input class="form-control" id="image" type="text" formControlName="image" placeholder="e.g. reef1.jpg">
      <div class="text-danger" *ngIf="f['image'].touched && f['image'].invalid">Image is required.</div>
    </div>

    <div class="mb-3">
      <label class="form-label" for="description">Description</label>
      <textarea class="form-control" id="description" rows="3" formControlName="description"></textarea>
      <div class="text-danger" *ngIf="f['description'].touched && f['description'].invalid">Description is required.</div>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Saving...' : 'Add Trip' }}
    </button>
    <a class="btn btn-secondary ms-2" routerLink="/">Cancel</a>
  </form>
</div>
