<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Trips</h1>
    <a routerLink="/add-trip" class="btn btn-success">Add Trip</a>
  </div>

  <div class="mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Search trips by name, resort, or description..."
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchChange($event)"
      aria-label="Search trips"
    />
  </div>

  <div class="alert alert-danger" *ngIf="loadError">{{ loadError }}</div>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let trip of trips">
      <app-trip-card [trip]="trip" (deleteTrip)="onDeleteTrip($event)"></app-trip-card>
    </div>
  </div>
</div>
